services:
  - type: web
    name: weather-detection-system
    runtime: python
    repo: https://github.com/mysiedhanya-muthu/weather-detection-system
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
